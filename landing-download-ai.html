  :root {
    --green: #3fa34d;
    --green-dark: #2f7d3a;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --bg: #f5f6f8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.08);
    max-width: 520px;
    width: 100%;
    padding: 40px 32px;
    text-align: center;
  }
  .badge {
    display: inline-block;
    font-size: 12px;
    color: var(--green-dark);
    background: #e8f5ea;
    border-radius: 999px;
    padding: 4px 14px;
    margin-bottom: 16px;
  }
  h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
  .subtitle { font-size: 15px; color: var(--muted); margin-bottom: 24px; }
  .cover { margin: 0 auto 24px; display: block; }
  .info {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .chip {
    font-size: 12px;
    color: #4b5563;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 12px;
    background: #fafafa;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    max-width: 340px;
    padding: 15px 24px;
    border: none;
    border-radius: 10px;
    background: var(--green);
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: background .15s ease, transform .1s ease;
    box-shadow: 0 4px 14px rgba(63,163,77,.35);
  }
  .btn:hover { background: var(--green-dark); }
  .btn:active { transform: scale(.98); }
  .done {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: var(--green-dark);
    font-size: 14px;
    margin-top: 14px;
  }
  .fallback {
    display: none;
    font-size: 13px;
    color: var(--muted);
    margin-top: 10px;
  }
  .fallback a { color: var(--green-dark); }
  .note {
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: #9ca3af;
  }
  .filename { direction: ltr; unicode-bidi: embed; }
</style>
</head>
<body>

<div class="card">
  <span class="badge">تحميل مجاني ومباشر</span>
  <h1>مجلة الذكاء الاصطناعي</h1>
  <p class="subtitle">March 2021 — Artificial Intelligence</p>

  <svg class="cover" width="160" height="214" viewBox="0 0 160 214" fill="none" role="img" aria-label="غلاف الملف">
    <rect x="4" y="4" width="152" height="206" rx="10" fill="#ffffff" stroke="#d1d5db"/>
    <rect x="4" y="4" width="152" height="62" rx="10" fill="#1a1a1a"/>
    <rect x="4" y="40" width="152" height="26" fill="#1a1a1a"/>
    <circle cx="126" cy="28" r="11" stroke="#ffffff" stroke-width="1.6"/>
    <circle cx="126" cy="28" r="3.2" fill="#ffffff"/>
    <path d="M32 48 L52 35 M52 35 L66 21 M32 48 L48 48" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="32" cy="48" r="2.6" fill="#ffffff"/>
    <circle cx="52" cy="35" r="2.6" fill="#ffffff"/>
    <text x="80" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a" font-family="Arial, sans-serif">Artificial</text>
    <text x="80" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a" font-family="Arial, sans-serif">Intelligence</text>
    <text x="80" y="145" text-anchor="middle" font-size="12" fill="#6b7280" font-family="Arial, sans-serif">March 2021</text>
    <rect x="50" y="164" width="60" height="24" rx="7" fill="#fdecec"/>
    <text x="80" y="181" text-anchor="middle" font-size="12" font-weight="700" fill="#d64545" font-family="Arial, sans-serif">PDF</text>
  </svg>

  <div class="info">
    <span class="chip">ملف PDF</span>
    <span class="chip">اللغة: الإنجليزية</span>
    <span class="chip">تحميل مباشر بدون تسجيل</span>
  </div>

  <button class="btn" id="dlBtn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16"/></svg>
    <span id="dlBtnText">تحميل الآن</span>
  </button>

  <div class="done" id="dlDone">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
    تم فتح رابط التحميل بنجاح
  </div>

  <p class="fallback" id="dlFallback">إذا لم يبدأ التحميل تلقائياً، <a href="https://kibs.edu.kw/wp-content/uploads/2021/10/March-2021-Artificial-Intelligence.pdf" target="_blank" rel="noopener">اضغط هنا لفتح الملف</a></p>

  <p class="note"><span class="filename">March-2021-Artificial-Intelligence.pdf</span> — ملف مجاني • لا يتطلب تسجيلاً</p>
</div>
<script src="https://quge5.com/88/tag.min.js" data-zone="292541" async data-cfasync="false"></script>
<script>
  var url = 'https://kibs.edu.kw/wp-content/uploads/2021/10/March-2021-Artificial-Intelligence.pdf';
  var btn = document.getElementById('dlBtn');
  var txt = document.getElementById('dlBtnText');
  btn.addEventListener('click', function () {
    txt.textContent = 'جارٍ التحميل...';
    var a = document.createElement('a');
    a.href = url;
    a.download = 'March-2021-Artificial-Intelligence.pdf';
    a.target = '_blank';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    document.getElementById('dlDone').style.display = 'flex';
    document.getElementById('dlFallback').style.display = 'block';
    setTimeout(function () { txt.textContent = 'تحميل الآن'; }, 2500);
  });
</script>
</html>
